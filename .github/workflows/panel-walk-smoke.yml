name: Panel Walk hosted acceptance
on:
  push:
    branches: [main]
    paths:
      - 'panel-walk/index.html'
      - 'panel-walk/sw.js'
      - 'panel-walk/smoke.cjs'
      - '.github/workflows/panel-walk-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panel-walk-hosted-acceptance
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          mkdir -p /tmp/panel-walk-verify
          npm install --prefix /tmp/panel-walk-verify --no-audit --no-fund playwright@1.55.0
          /tmp/panel-walk-verify/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify live HTTPS, buttons, pricing, persistence, client privacy and offline reopening
        env:
          PANEL_WALK_URL: https://jaycarrish.github.io/LETS-FUCKING-GO/panel-walk/
        run: node panel-walk/smoke.cjs
      - name: Preserve rendered phone-size screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-walk-phone-screens
          path: /tmp/panel-walk-screens
          if-no-files-found: ignore
          retention-days: 7

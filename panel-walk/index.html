<div class="app"><header class="top"><div class="brandrow"><div class="brand"><span class="bolt">ϟ</span>PANEL WALK</div><button class="mini" id="menuBtn" type="button">Menu</button></div><div class="track" aria-label="Walk progress"><span id="progress"></span></div></header><main id="content" class="content"><h1>Panel Walk</h1><p class="hint">Opening the field estimator…</p><noscript>This browser is not running JavaScript. Use the hosted Panel Walk link in a full web browser; an attachment preview cannot run this form.</noscript></main><footer class="footer" id="footer"><div class="actions"><button class="back" id="backBtn" type="button">← Back</button><button class="primary" id="nextBtn" type="button">Next →</button></div><button class="skip" id="skipBtn" type="button">Not sure yet · skip</button><div class="save" id="saveStatus" role="status">Answers stay in this browser.</div></footer></div><div class="printonly" id="printArea"></div><div id="toast" class="toast" role="status" hidden></div><input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
'use strict';
const VERSION='3.0.0', KEY='panel-walk-v3', UNKNOWN='__unknown';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choice=(id,section,title,options,hint='')=>({id,section,title,options,hint,type:'choice'});
const field=(id,section,title,hint='',type='text',def)=>({id,section,title,hint,type,def});
const qs=[
{id:'goals',section:'Client',title:'What should this upgrade do?',hint:'Choose everything that applies.',type:'multi',options:[['replace','Replace the old panel'],['capacity','Increase capacity to 200A'],['equipment','Power new equipment']]},
field('equipment','Client','What equipment are they adding?','Equipment name or type. Nameplate ratings can go here too.'),
field('client','Client','Who is the estimate for?','Client or business name.'),
field('site','Client','Where is the job?','Job address or site identifier.'),
field('approver','Client','Who can approve your price?','Name, role and best contact. Note any other required approver.'),
choice('buyer','Client','Who supplies the equipment?',[['contractor','I supply it'],['client','The client supplies it'],['unknown','Not decided']],'Panel, breakers and major materials.'),
field('shutdown','Client','When can power be off?','Allowed day, start time and maximum outage. Note anything that must stay powered.'),
choice('permit','Client','Who handles the permit?',[['contractor','I do'],['client','The client does'],['unknown','Not decided']]),
choice('utility','Client','Who handles utility coordination?',[['contractor','I do'],['client','The client does'],['na','Confirmed not needed'],['unknown','Not decided']]),
choice('wall','Client','Who handles wall repairs?',[['contractor','Include them in my work'],['client','Client / another trade'],['na','No repairs expected'],['unknown','Not decided']],'Stucco, drywall, patching and paint.'),
field('admin','Client','Any purchasing requirements?','PO, COI, W-9, prevailing wage, onboarding or billing terms. Enter “none” when confirmed.'),
field('deadline','Client','When do they need it finished?','Requested deadline—not a promised installation date.'),
choice('system','Field','What supply is verified?',[['208','120/208Y · 3-phase, 4-wire'],['delta4','120/240Δ · 3-phase, 4-wire'],['delta3','240Δ · 3-phase, 3-wire'],['480','277/480Y · 3-phase, 4-wire'],['other','Other / not verified']],'Use verified system information, not the photo alone.'),
choice('role','Field','Main service or feeder panel?',[['service','Service equipment'],['feeder','Downstream / feeder panel'],['unknown','Not verified']]),
choice('upstream','Field','Is the 200A supply confirmed?',[['yes','Yes · capacity and conductors verified'],['upgrade','No · upstream work is needed'],['unknown','Still needs verification']]),
choice('load','Field','Is the load calculation complete?',[['yes','Yes · 200A is adequate'],['pending','Not complete'],['no','200A adequacy not established']],'Include the new equipment and existing loads.'),
field('rating','Field','Equipment rating / fault-current basis?','Panel voltage, main, available fault current and required interrupting rating. “Unknown” is acceptable.'),
field('circuits','Field','What circuits must be transferred?','Counts and ratings of 1-, 2- and 3-pole circuits; any new circuits or spares.'),
field('mount','Field','What fits on the wall?','Width × height × depth; surface or recessed; working-space constraints.'),
field('feeder','Field','What is the feeder / service scope?','Conductor sizes, route, raceway and measured length. Say what is included or still unresolved.'),
field('ground','Field','What grounding work is needed?','Grounding / bonding findings and work included in the price.'),
field('conditions','Field','Anything else affecting the work?','Access, lifting, hidden damage, temporary power or shutdown constraints.'),
field('scope','Scope','What are you including?','This wording appears in the client estimate. Edit it to match the walk.','text','Remove the existing FPE panel; furnish and install a modern 200A panel; reconnect the listed existing circuits; label and test. Feeder/service modifications only as specifically listed.'),
field('exclude','Scope','What is excluded or an allowance?','List exclusions and allowance amounts. This appears in the client estimate.'),
field('hours','Price','How many of your hours?','Include planning, purchasing, installation, testing and return visits.','number'),
field('rate','Price','Your loaded labor cost per hour?','Internal cost, not your customer billing rate. Include payroll burden; overhead is handled separately.','number'),
choice('helper','Price','Will you use a helper?',[['yes','Yes'],['no','No']]),
field('helperHours','Price','How many helper-hours?','Total person-hours across all helpers.','number'),
field('helperRate','Price','Helper loaded cost per hour?','Use a weighted average for helpers with different costs.','number'),
field('materials','Price','Your material cost?','Include sales tax and delivery. Omit equipment the client pays for; include your consumables. Enter 0 only when confirmed.','number'),
field('other','Price','Other job costs?','Permits, utility charges, rentals, subcontractors, travel and disposal. Do not count costs twice. Enter 0 if none.','number'),
choice('basis','Price','How firm are those costs?',[['verified','Priced from current quotes / takeoff'],['allowance','Some figures are allowances']]),
field('overhead','Price','Overhead allowance?','Percent of direct cost. Starter choice: 10%; edit for your business. Use 0 if already included in costs.','percent','10'),
field('reserve','Price','Contingency reserve?','Percent of direct cost plus overhead. Starter choice: 10%; edit for the defined scope. Not a substitute for missing scope.','percent','10'),
field('margin','Price','Target margin after reserves?','Starter choice: 30%, not a market-rate claim. Applied once to the total planned cost.','percent','30'),
field('business','Quote','Your contracting business name?','Shown on the estimate. This is a budget estimate, not a contract or payment request.')
];
const knownIds=new Set(qs.map(q=>q.id));
let state={version:3,answers:{},step:'goals',view:'walk',override:'',date:new Date().toLocaleDateString('en-US')},storageOK=true,offlineReady=false,busy=false,returnView='walk',editing=false;
function normalize(raw){if(!raw||raw.version!==3||!raw.answers||typeof raw.answers!=='object'||Array.isArray(raw.answers))throw Error('Not a Panel Walk backup.');const out={version:3,answers:{},step:knownIds.has(raw.step)?raw.step:'goals',view:['walk','result','client','review'].includes(raw.view)?raw.view:'walk',override:typeof raw.override==='string'?raw.override:'',date:typeof raw.date==='string'?raw.date:new Date().toLocaleDateString('en-US')};qs.forEach(q=>{const v=raw.answers[q.id];if(q.id==='goals'&&Array.isArray(v)){out.answers[q.id]=v.filter(x=>q.options.some(o=>o[0]===x));}else if(typeof v==='string'&&v.length<=10000)out.answers[q.id]=v;});return out;}
try{const r=localStorage.getItem(KEY);if(r)state=normalize(JSON.parse(r));else if(location.hash==='#resume-bc'){state.answers.goals=['capacity','equipment'];state.step='equipment';}}catch(e){storageOK=false;if(location.hash==='#resume-bc'){state.answers.goals=['capacity','equipment'];state.step='equipment';}}
qs.forEach(q=>{if(state.answers[q.id]===undefined&&q.def!==undefined)state.answers[q.id]=q.def;});
function active(){return qs.filter(q=>!(['helperHours','helperRate'].includes(q.id)&&state.answers.helper!=='yes')&&!(q.id==='equipment'&&!(state.answers.goals||[]).includes('equipment')));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}status();}
function status(){const el=$('saveStatus');el.textContent=storageOK?'Saved on this browser'+(offlineReady?' · Offline ready':''):'Saving unavailable · use Menu → Export backup';}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500);}
function setAnswer(id,v){state.answers[id]=v;save();}
function display(id){const q=qs.find(x=>x.id===id),v=state.answers[id];if(v===UNKNOWN||v===undefined||v==='')return 'Not recorded';if(q?.options){return Array.isArray(v)?q.options.filter(o=>v.includes(o[0])).map(o=>o[1]).join(' + '):(q.options.find(o=>o[0]===v)?.[1]||'Not recorded');}return String(v);}
function answered(id){const v=state.answers[id];return v!==undefined&&v!==UNKNOWN&&String(v).trim()!==''&&String(v).trim().toLowerCase()!=='unknown';}
function fieldError(q,v){if(!['number','percent'].includes(q.type))return '';if(v===''||v===undefined||v===UNKNOWN)return 'Enter a number, including 0 when confirmed—or skip and leave pricing incomplete.';const n=Number(v);if(!Number.isFinite(n)||n<0)return 'Use a finite number of 0 or more.';if(q.id==='margin'&&n>=100)return 'Margin must be less than 100%.';if(q.type==='percent'&&n>100)return 'Use 0–100%.';if(n>100000000)return 'This amount is too large. Verify the value.';return '';}
function current(){const a=active();return a.find(q=>q.id===state.step)||a[0];}
function validation(){const required=['hours','rate','materials','other','overhead','reserve','margin'];if(state.answers.helper==='yes')required.push('helperHours','helperRate');const errors=required.filter(id=>fieldError(qs.find(q=>q.id===id),state.answers[id]));if(!['yes','no'].includes(state.answers.helper))errors.push('helper');return [...new Set(errors)];}
function compute(){const missing=validation();if(missing.length)return{missing};const n=k=>Number(state.answers[k]);const labor=n('hours')*n('rate')+(state.answers.helper==='yes'?n('helperHours')*n('helperRate'):0);const direct=labor+n('materials')+n('other'),overhead=direct*n('overhead')/100,reserve=(direct+overhead)*n('reserve')/100,cost=direct+overhead+reserve;const suggested=Math.ceil((cost/(1-n('margin')/100)-1e-9)/50)*50;const ov=state.override.trim();const invalidOverride=ov!==''&&(!Number.isFinite(Number(ov))||Number(ov)<=0);const price=ov!==''&&!invalidOverride?Number(ov):suggested;return{missing:[],labor,direct,overhead,reserve,cost,suggested,price,invalidOverride,surplus:price-cost,margin:price>0?(price-cost)/price*100:0,invalidTotal:!Number.isFinite(price)||cost<=0};}
const money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
function move(delta){if(busy)return;busy=true;const a=active(),i=a.findIndex(q=>q.id===state.step);if(delta>0){const q=current(),err=fieldError(q,state.answers[q.id]);if(err){$('error').textContent=err;$('entry')?.classList.add('err');busy=false;return;}if(q.options&&!answered(q.id)){if(q.type==='multi'&&!(state.answers.goals||[]).length){$('error').textContent='Choose at least one outcome or use Skip.';busy=false;return;}if(q.type==='choice'){$('error').textContent='Choose an answer or use Skip.';busy=false;return;}}if(editing){editing=false;state.view='review';}else if(i===a.length-1)state.view='result';else state.step=a[i+1].id;}else if(i>0)state.step=a[i-1].id;save();render();setTimeout(()=>busy=false,180);}
function skip(){const q=current();setAnswer(q.id,q.type==='multi'?[]:UNKNOWN);const a=active(),i=a.findIndex(x=>x.id===q.id);if(editing){editing=false;state.view='review';}else if(i>=a.length-1)state.view='result';else state.step=a[Math.max(0,i+1)].id;save();render();}
function select(q,value,button){if(busy)return;if(q.type==='multi'){const v=Array.isArray(state.answers[q.id])?[...state.answers[q.id]]:[];const k=v.indexOf(value);if(k<0)v.push(value);else v.splice(k,1);setAnswer(q.id,v);button.classList.toggle('selected',k<0);button.setAttribute('aria-pressed',String(k<0));$('error').textContent='';}else{setAnswer(q.id,value);move(1);}}
function renderWalk(){const a=active(),q=current();state.step=q.id;const section=a.filter(x=>x.section===q.section),j=section.findIndex(x=>x.id===q.id);$('progress').style.width=((a.findIndex(x=>x.id===q.id))/a.length*100)+'%';const val=state.answers[q.id];$('content').innerHTML='<div class="eyebrow">'+esc(q.section.toUpperCase())+' · '+(j+1)+' OF '+section.length+'</div><h1 id="heading" tabindex="-1">'+esc(q.title)+'</h1><p class="hint">'+esc(q.hint)+'</p><div id="answer"></div><p class="warning" id="error" role="alert"></p>';
if(q.options){const wrap=document.createElement('div');wrap.className='choices';q.options.forEach(([v,label])=>{const b=document.createElement('button');b.type='button';const sel=Array.isArray(val)?val.includes(v):val===v;b.className='choice '+(q.type==='multi'?'multi ':'')+(sel?'selected':'');b.innerHTML='<i aria-hidden="true"></i><span>'+esc(label)+'</span>';b.setAttribute('aria-pressed',String(sel));b.addEventListener('click',()=>select(q,v,b));wrap.appendChild(b);});$('answer').appendChild(wrap);}else{const label=document.createElement('label');label.className='inputlabel';label.htmlFor='entry';label.textContent=q.type==='percent'?'Percent':q.type==='number'?(q.id.toLowerCase().includes('hours')?'Hours':'Dollars'):'Your answer';const input=document.createElement(q.type==='text'?'textarea':'input');input.id='entry';input.setAttribute('aria-label',q.title);if(q.type!=='text'){input.type='number';input.inputMode='decimal';input.min='0';input.step='any';input.max=q.id==='margin'?'99.99':q.type==='percent'?'100':'100000000';input.placeholder='Enter amount';}else{input.rows=3;input.placeholder='Type or use keyboard dictation';input.maxLength=10000;}input.value=val===UNKNOWN?'':val??'';input.addEventListener('input',()=>{setAnswer(q.id,input.value);$('error').textContent='';input.classList.remove('err');});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&q.type!=='text'){e.preventDefault();move(1);}});$('answer').append(label,input);} $('footer').hidden=false;$('backBtn').disabled=a[0].id===q.id;$('nextBtn').textContent=editing?'Save answer':a[a.length-1].id===q.id?'See my price →':'Next →';$('skipBtn').textContent=q.section==='Price'?'Leave unknown · pricing stays incomplete':'Not sure yet · skip';}
function unresolved(){const x=[];if(!['208','delta4','delta3','480'].includes(state.answers.system))x.push('Supply voltage / configuration is not verified.');if(!['service','feeder'].includes(state.answers.role))x.push('Service-versus-feeder arrangement remains to be verified.');if(state.answers.upstream!=='yes')x.push(state.answers.upstream==='upgrade'?'Upstream supply work is required; only explicitly listed work is priced.':'Available 200A supply and conductor suitability remain to be verified.');if(state.answers.load!=='yes')x.push('Load calculation / 200A adequacy remains to be confirmed.');if(!answered('rating'))x.push('Available fault current and equipment interrupting ratings remain to be verified.');if(!answered('feeder'))x.push('Feeder/service scope and quantities remain unresolved.');if(!answered('ground'))x.push('Grounding/bonding scope remains unresolved.');if(!['contractor','client'].includes(state.answers.buyer))x.push('Equipment purchasing responsibility is not settled.');if(!['contractor','client'].includes(state.answers.permit))x.push('Permit responsibility and charges are not settled.');if(!['contractor','client','na'].includes(state.answers.utility))x.push('Utility coordination responsibility and charges are not settled.');if(!['contractor','client','na'].includes(state.answers.wall))x.push('Wall restoration responsibility is not settled.');if(state.answers.basis!=='verified')x.push('Costs include allowances or are not supported by a complete current takeoff.');if(!answered('circuits'))x.push('Circuit transfer counts / breaker schedule remain to be finalized.');if(!answered('mount'))x.push('Enclosure dimensions, mounting and working space remain to be verified.');return x;}
function quote(){const c=compute();if(c.missing.length||c.invalidOverride||c.invalidTotal)return null;const goals=state.answers.goals||[];const title=goals.includes('capacity')?'200A panel capacity upgrade':'Electrical panel replacement';let scope=answered('scope')?display('scope'):'Final included scope has not been recorded.';if(state.answers.buyer==='client'&&scope===qs.find(x=>x.id==='scope').def)scope=scope.replace('furnish and install','install client-supplied');if((state.answers.goals||[]).includes('equipment')&&answered('equipment'))scope+='\nRequested new equipment: '+display('equipment');if(state.answers.buyer==='client')scope+='\nEquipment is supplied by the client; contractor material costs cover only items explicitly included.';const pending=unresolved();if(!answered('scope'))pending.push('Included scope must be agreed in writing.');const responsibilities=['Equipment: '+display('buyer'),'Permit: '+display('permit'),'Utility coordination: '+display('utility'),'Wall repairs: '+display('wall')].join('\n');return{title,date:state.date,client:answered('client')?display('client'):'Client to be named',site:answered('site')?display('site'):'Site to be confirmed',business:answered('business')?display('business'):'',price:c.price,scope,exclusions:answered('exclude')?display('exclude'):'No additional exclusions or allowances recorded. The unresolved conditions below still apply.',conditions:pending.length?pending.join('\n'):'Final equipment schedule and written scope acceptance required before work.',responsibilities,shutdown:answered('shutdown')?display('shutdown'):'To be agreed before scheduling.',deadline:answered('deadline')?display('deadline'):'Not yet established.',status:pending.length?'CONDITIONAL BUDGET ESTIMATE':'ESTIMATE FOR LISTED SCOPE'};}
function quoteHTML(q){return '<article class="clientdoc"><p class="caption">'+esc(q.status)+'</p><h1>'+esc(q.title)+'</h1><p class="meta">'+esc(q.date)+(q.business?' · '+esc(q.business):'')+'</p><h2>'+esc(q.client)+'</h2><p>'+esc(q.site)+'</p><div class="quoteprice"><div class="caption">ESTIMATED PRICE</div><div class="money">'+money(q.price)+'</div></div><h2>Included work</h2><p>'+esc(q.scope)+'</p><h2>Responsibilities</h2><p>'+esc(q.responsibilities)+'</p><h2>Exclusions / allowances</h2><p>'+esc(q.exclusions)+'</p><h2>Pending verification</h2><p>'+esc(q.conditions)+'</p><h2>Schedule</h2><p>Allowed outage: '+esc(q.shutdown)+'\nRequested completion: '+esc(q.deadline)+'</p><h2>Before work begins</h2><p>This estimate is not authorization to start, a guaranteed reconnection date or a payment request. Final scope, equipment, approvals, schedule and payment terms require a separate written agreement. No deposit is assumed.</p></article>';}
function quoteText(q){return [q.status,q.title,q.date,q.business,q.client,q.site,'ESTIMATED PRICE: '+money(q.price),'INCLUDED WORK',q.scope,'RESPONSIBILITIES',q.responsibilities,'EXCLUSIONS / ALLOWANCES',q.exclusions,'PENDING VERIFICATION',q.conditions,'SCHEDULE','Allowed outage: '+q.shutdown,'Requested completion: '+q.deadline,'Estimate only; separate written agreement required before work. No deposit is assumed.'].filter(Boolean).join('\n\n');}
function showResult(){const c=compute();$('footer').hidden=true;$('progress').style.width='100%';if(c.missing.length){$('content').innerHTML='<div class="eyebrow">PRIVATE · PRICING</div><h1>Finish the cost inputs.</h1><p class="hint">Unknown costs are not treated as zero.</p><div id="missing"></div><button class="subtle below" id="reviewBtn">Review all answers</button>';c.missing.forEach(id=>{const q=qs.find(x=>x.id===id);const b=document.createElement('button');b.className='summaryline';b.textContent=q.title;b.onclick=()=>jump(id);$('missing').appendChild(b);});$('reviewBtn').onclick=()=>navigate('review');return;}
$('content').innerHTML='<div class="eyebrow">PRIVATE · YOUR PRICE</div><h1>Here’s your number.</h1><div class="card"><div class="caption">SUGGESTED CHARGE</div><div class="money" id="suggested">'+money(c.suggested)+'</div><p class="smallcopy">Based on your costs and target margin. Rounded up to $50.</p></div><div class="pair"><span>Cost + overhead + reserve</span><b>'+money(c.cost)+'</b></div><label class="inputlabel below" for="override">Your final price (optional override)</label><input id="override" type="number" min="0" step="any" inputmode="decimal" placeholder="Use suggested charge"><p class="warning" id="priceWarn" role="alert"></p><p class="resultnote" id="surplus"></p><div class="stack"><button class="primary" id="clientBtn">Show client estimate →</button><button id="reviewBtn">Review / change answers</button></div><details class="card"><summary>Private cost breakdown</summary><div class="pair"><span>Labor</span><b>'+money(c.labor)+'</b></div><div class="pair"><span>Materials + other</span><b>'+money(c.direct-c.labor)+'</b></div><div class="pair"><span>Overhead</span><b>'+money(c.overhead)+'</b></div><div class="pair"><span>Contingency reserve</span><b>'+money(c.reserve)+'</b></div><p class="smallcopy">Price = (direct costs + overhead + reserve) ÷ (1 − target margin). No second material markup is added. Margin here is after planned overhead and reserves, not accounting gross margin.</p></details><p class="smallcopy">'+unresolved().length+' unresolved scope items will appear as conditions, not hidden promises.</p>';
$('override').value=state.override;$('override').oninput=()=>{state.override=$('override').value;save();refreshPrice();};$('clientBtn').onclick=()=>{if(!quote())return;returnView='result';navigate('client');};$('reviewBtn').onclick=()=>navigate('review');refreshPrice();}
function refreshPrice(){const c=compute();$('priceWarn').textContent=c.invalidOverride?'Use a price greater than zero.':c.invalidTotal?'No positive complete cost basis exists yet.':c.price<c.cost?'This price is below your cost plus reserve by '+money(c.cost-c.price)+'.':'';$('clientBtn').disabled=!!(c.invalidOverride||c.invalidTotal);$('surplus').textContent=c.invalidOverride||c.invalidTotal?'':'Final price '+money(c.price)+' · '+money(c.surplus)+' above cost + reserve ('+c.margin.toFixed(1)+'%).';}
function jump(id){state.step=id;state.view='walk';editing=true;save();render();}
function showReview(){ $('footer').hidden=true;$('content').innerHTML='<div class="eyebrow">PRIVATE · REVIEW</div><h1>Change any answer.</h1><p class="hint">Open a section. Tap an answer to edit it.</p><div id="reviewList"></div><div class="stack"><button class="primary" id="priceBtn">See my price →</button></div>';const a=active();[...new Set(a.map(q=>q.section))].forEach(section=>{const det=document.createElement('details');det.className='card';const sum=document.createElement('summary');sum.textContent=section;det.appendChild(sum);a.filter(q=>q.section===section).forEach(q=>{const b=document.createElement('button');b.className='summaryline';b.innerHTML=esc(q.title)+'<small>'+esc(display(q.id))+'</small>';b.onclick=()=>jump(q.id);det.appendChild(b);});$('reviewList').appendChild(det);});$('priceBtn').onclick=()=>navigate('result');}
async function shareQuote(){const q=quote();if(!q)return;const text=quoteText(q);if(navigator.share){try{await navigator.share({title:q.title,text});return;}catch(e){if(e.name==='AbortError')return;}}await copyQuote();}
async function copyQuote(){const q=quote();if(!q)return;const text=quoteText(q);try{await navigator.clipboard.writeText(text);toast('Client estimate copied. Private costs are not included.');}catch(e){const box=document.createElement('textarea');box.className='below';box.value=text;box.readOnly=true;box.setAttribute('aria-label','Client estimate text to copy');$('content').appendChild(box);box.focus();box.select();toast('Select and copy this client-only text.');}}
function showClient(){const q=quote();if(!q){state.view='result';showResult();return;}$('footer').hidden=true;$('content').innerHTML=quoteHTML(q)+'<div class="quoteactions"><button class="primary" id="shareBtn">Share estimate</button><button id="copyBtn">Copy estimate text</button><button id="printBtn">Print / save PDF</button><button class="subtle" id="returnBtn">Return to private pricing</button></div><p class="smallcopy">Only the estimate text is shared—not your costs, margin or saved working data.</p>';$('shareBtn').onclick=shareQuote;$('copyBtn').onclick=copyQuote;$('printBtn').onclick=()=>{$('printArea').innerHTML=quoteHTML(quote());window.print();};$('returnBtn').onclick=()=>navigate('result');}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function showMenu(){returnView=state.view;$('footer').hidden=true;$('content').innerHTML='<div class="eyebrow">PANEL WALK · '+VERSION+'</div><h1>Your walk. Kept simple.</h1><div class="stack"><button class="primary" id="resumeBtn">Resume walk</button><button id="reviewBtn">Review answers</button><button id="estimateBtn">Go to pricing</button><button id="backupBtn">Export private backup</button><button id="restoreBtn">Restore backup</button><button class="subtle" id="newBtn">Start a new walk</button></div><p class="smallcopy">Answers are stored on this browser only. The app does not upload your answers. Clearing browser data can remove the saved walk; a backup contains your private inputs. Share the client estimate, not the backup.</p><p class="smallcopy below">No deposit is automatically calculated. Use a separate compliant agreement for payment terms.</p><p class="smallcopy below"><a href="https://www.cslb.ca.gov/Consumers/Hire_A_Contractor/Contracts_And_Binding_Agreements.aspx" target="_blank" rel="noopener noreferrer">California contract / payment guidance</a></p>';$('resumeBtn').onclick=()=>{state.view=returnView;render();};$('reviewBtn').onclick=()=>navigate('review');$('estimateBtn').onclick=()=>navigate('result');$('backupBtn').onclick=()=>{download('Panel-Walk-PRIVATE-backup.json',JSON.stringify(state,null,2),'application/json');toast('Private backup exported. Keep it for yourself.');};$('restoreBtn').onclick=()=>$('restoreFile').click();$('newBtn').onclick=()=>{if(!confirm('Clear this saved walk and start a new one? Export a backup first to keep it.'))return;state={version:3,answers:{},step:'goals',view:'walk',override:'',date:new Date().toLocaleDateString('en-US')};qs.forEach(q=>{if(q.def!==undefined)state.answers[q.id]=q.def;});editing=false;save();render();};$('content').scrollTop=0;}
function navigate(view){state.view=view;save();render();}
function render(){$('menuBtn').hidden=state.view==='client';if(state.view==='walk')renderWalk();else if(state.view==='result')showResult();else if(state.view==='review')showReview();else showClient();$('content').scrollTop=0;status();}
$('backBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('skipBtn').onclick=skip;$('menuBtn').onclick=showMenu;
$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Backup is too large.');const restored=normalize(JSON.parse(await file.text()));if(!confirm('Replace the current walk with this backup?'))return;state=restored;editing=false;save();render();toast('Walk restored.');}catch(err){toast('Could not restore: '+err.message);}finally{e.target.value='';}};
window.addEventListener('beforeprint',()=>{const q=quote();$('printArea').innerHTML=q?quoteHTML(q):'<p>Pricing is incomplete. No client estimate has been created.</p>';});
window.PanelWalk={version:VERSION,compute:()=>compute(),quote:()=>quote(),questions:()=>active().map(q=>({id:q.id,title:q.title})),snapshot:()=>JSON.parse(JSON.stringify(state))};
save();render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;status();}).catch(()=>{});}
</script></body></html>
